<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>촬영 가이드 만들기 — Instay</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 화면이 그려지기 전에 실행되어야 하므로 head에 둔다 (번쩍임 방지) -->
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- index.html의 상단 바와 똑같은 내용. 단, 앵커 앞에 index.html을 붙였다. -->
  <nav>
    <a class="logo" href="index.html">Instay</a>
    <div class="nav-links">
      <a href="index.html#home">홈</a>
      <a href="index.html#how">이렇게 씁니다</a>
      <a href="index.html#faq">자주 묻는 질문</a>
      <a href="guide.html">촬영 가이드 만들기</a>
    </div>
    <button type="button" id="theme-toggle">어둡게</button>
  </nav>

  <main>
    <h1>촬영 가이드 만들기</h1>
    <p>숙소 정보를 입력하면 촬영 장면 5컷과 캡션 초안을 만들어 드립니다.</p>

    <!-- 입력 폼 -->
    <form id="guide-form">
      <label for="stay-type">숙소 유형</label>
      <select id="stay-type">
        <option>풀빌라</option>
        <option>독채</option>
        <option>호텔</option>
        <option>펜션</option>
        <option>캠핑·글램핑</option>
      </select>

      <label for="features">숙소 특징 <em>필수</em></label>
      <textarea id="features" rows="3"
                placeholder="예: 바다 바로 앞, 개별 스파, 반려견 동반 가능"></textarea>
      <p class="field-hint">Ctrl + Enter 로도 만들 수 있습니다.</p>
      <!-- 빈 입력일 때 여기에 안내가 뜬다. role="alert" 는 화면 낭독기가 즉시 읽게 한다. -->
      <p class="field-error" id="features-error" role="alert" hidden></p>

      <label for="tone">영상 톤</label>
      <select id="tone">
        <option>감성</option>
        <option>정보</option>
        <option>유머</option>
      </select>

      <button type="submit" id="submit-btn">가이드 만들기</button>
    </form>

    <!-- 결과가 표시될 자리. 내용은 JavaScript가 채운다. -->
    <section id="result-area" aria-live="polite">
      <p class="placeholder">숙소 정보를 입력하고 버튼을 누르면 여기에 결과가 나옵니다.</p>
    </section>
  </main>

  <footer>
    <p>Instay — 코디세이 AI 네이티브 미션 A2-03 학습용 프로젝트</p>
  </footer>

  <script src="js/guide.js"></script>
</body>
</html>
